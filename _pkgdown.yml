url: https://kaipingyang.github.io/shinyAssistantUI/
destination: docs

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#2563eb"
    border-radius: 0.75rem

home:
  title: shinyAssistantUI
  description: >
    A backend-agnostic assistant-ui chat surface for Shiny applications.

development:
  mode: release

navbar:
  structure:
    left: [home, overview, installation, articles, reference, news]
    right: [search, github]
  components:
    overview:
      text: Overview
      href: articles/shiny-assistant-ui.html
    installation:
      text: Installation
      href: articles/installation.html

articles:
- title: Start here
  navbar: ~
  contents:
  - shiny-assistant-ui
  - installation
- title: Compatibility and roadmap
  contents:
  - upstream-alignment
  - a2ui-shiny-contract

reference:
